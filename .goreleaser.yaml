version: 2

project_name: treeball

before:
  hooks:
    - make clean
    - make vendor
    - make lint
    - make test

builds:
  - id: treeball
    main: ./cmd/treeball
    binary: treeball
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=vendor
    flags:
      - -trimpath
    ldflags:
      - -w
      - -s
      - -X main.Version={{.Version}}
      - -buildid=
    goos:
      - linux
      - darwin
    goarch:
    - amd64
    - arm
    - arm64
    - 386

source:
  enabled: false

archives:
  -
    files:
      - README
      - LICENSE

signs:
  - artifacts: checksum

release:
  draft: true
  header: |
    ## Packages
    | Distribution | Package |
    |:--|:--|
    | Debian / Ubuntu | `.deb` |
    | Fedora / RHEL | `.rpm` |
    | Arch Linux | `.pkg.tar.zst` |
    | Generic Linux (Binaries) | `.tar.gz` |
  footer: |
    Most users will want the `linux_amd64` package (see installation instructions in `README`).  

    `.txz`, `.asc` and `.md5` files are part of the Slackware distribution package.  
    These specific packages are offered as a service for fellow Unraid OS enthusiasts.

changelog:
  use: github
  filters:
    exclude:
    - "^Merge"
    - "\\(ci\\)"

nfpms:
  - package_name: treeball
    maintainer: "desertwitch <dezertwitsh@gmail.com>"
    description: "Creates, diffs, and lists directory trees as archives"
    vendor: "desertwitch"
    homepage: "https://github.com/desertwitch/treeball"
    license: "MIT"
    section: utils
    formats:
      - deb
      - rpm
      - archlinux
